name: Feature Request
description: Suggest an idea for Nebula Sentinel
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What problem does this solve for SOC operators?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Attack Graph
        - Multi-Agent / MCP
        - Incidents / CVE
        - AI Assistant
        - API / Backend
        - UI / UX
        - Other
